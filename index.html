<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cyber Dodge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030308;
      color: #00f0ff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 450px;
      padding: 10px;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .hud span {
      color: #ff0055;
      font-size: 1.1rem;
    }
    canvas {
      background: radial-gradient(circle at center, #0a0a1a 0%, #020205 100%);
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      width: 100%;
      max-width: 450px;
      aspect-ratio: 3 / 4;
      display: block;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      top: 65px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: rgba(3, 3, 8, 0.88);
      border: 1px solid #ff0055;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .overlay h1 {
      font-size: 2.2rem;
      color: #00f0ff;
      text-shadow: 0 0 10px #00f0ff, 0 0 20px #ff0055;
      margin-bottom: 10px;
    }
    .overlay p {
      color: #cccccc;
      margin-bottom: 20px;
      font-size: 0.95rem;
      padding: 0 10px;
    }
    .btn {
      background: transparent;
      color: #ff0055;
      border: 2px solid #ff0055;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
      transition: all 0.2s ease-in-out;
    }
    .btn:hover {
      background: #ff0055;
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
      transform: scale(1.05);
    }
    .hidden {
      display: none !important;
    }
    .instructions {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #606080;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="hud">
      <div>Score: <span id="scoreDisplay">0</span></div>
      <div>Cyber Dodge</div>
      <div>Best: <span id="highScoreDisplay">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="533"></canvas>

    <div id="startScreen" class="overlay">
      <h1>CYBER DODGE</h1>
      <p>Dodge incoming energy hazards, grab green shields, and survive the digital rain!</p>
      <button class="btn" onclick="startGame()">Start Run</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
      <h1>SYSTEM OVERLOAD</h1>
      <p id="overText">Score: 0</p>
      <button class="btn" onclick="startGame()">Reboot</button>
    </div>

    <div class="instructions">Controls: Drag Mouse/Touch or Arrow Keys to Move</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const overText = document.getElementById('overText');

    let score = 0;
    let highScore = localStorage.getItem('cyberDodge_high') || 0;
    let gameRunning = false;
    let animationId;
    let frameCount = 0;

    highScoreDisplay.innerText = highScore;

    // Player Object
    const player = {
      x: canvas.width / 2 - 15,
      y: canvas.height - 50,
      size: 30,
      speed: 6,
      hasShield: false,
      isMovingLeft: false,
      isMovingRight: false,

      draw() {
        ctx.fillStyle = this.hasShield ? '#00ff66' : '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.hasShield ? '#00ff66' : '#00f0ff';
        
        // Player Ship Shape
        ctx.beginPath();
        ctx.moveTo(this.x + this.size / 2, this.y);
        ctx.lineTo(this.x + this.size, this.y + this.size);
        ctx.lineTo(this.x, this.y + this.size);
        ctx.closePath();
        ctx.fill();

        if (this.hasShield) {
          ctx.strokeStyle = '#00ff66';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.shadowBlur = 0;
      },

      update() {
        if (this.isMovingLeft && this.x > 0) this.x -= this.speed;
        if (this.isMovingRight && this.x < canvas.width - this.size) this.x += this.speed;
        this.draw();
      }
    };

    let hazards = [];
    let powerups = [];

    function spawnHazards() {
      if (frameCount % Math.max(15, 45 - Math.floor(score / 50)) === 0) {
        const size = 15 + Math.random() * 20;
        hazards.push({
          x: Math.random() * (canvas.width - size),
          y: -size,
          size: size,
          speed: 3 + Math.random() * 4 + score / 200
        });
      }

      // Spawn shield powerups occasionally
      if (frameCount % 400 === 0 && !player.hasShield) {
        powerups.push({
          x: Math.random() * (canvas.width - 20),
          y: -20,
          size: 20,
          speed: 2.5
        });
      }
    }

    function handleHazards() {
      for (let i = hazards.length - 1; i >= 0; i--) {
        let h = hazards[i];
        h.y += h.speed;

        ctx.fillStyle = '#ff0055';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.arc(h.x + h.size / 2, h.y + h.size / 2, h.size / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Collision Check
        if (
          player.x < h.x + h.size &&
          player.x + player.size > h.x &&
          player.y < h.y + h.size &&
          player.y + player.size > h.y
        ) {
          if (player.hasShield) {
            player.hasShield = false;
            hazards.splice(i, 1);
          } else {
            endGame();
          }
          continue;
        }

        if (h.y > canvas.height) {
          hazards.splice(i, 1);
          score += 10;
          scoreDisplay.innerText = score;
          if (score > highScore) {
            highScore = score;
            highScoreDisplay.innerText = highScore;
            localStorage.setItem('cyberDodge_high', highScore);
          }
        }
      }
    }

    function handlePowerups() {
      for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.y += p.speed;

        ctx.fillStyle = '#00ff66';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ff66';
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.shadowBlur = 0;

        // Collision Check
        if (
          player.x < p.x + p.size &&
          player.x + player.size > p.x &&
          player.y < p.y + p.size &&
          player.y + player.size > p.y
        ) {
          player.hasShield = true;
          powerups.splice(i, 1);
          continue;
        }

        if (p.y > canvas.height) powerups.splice(i, 1);
      }
    }

    function update() {
      if (!gameRunning) return;
      frameCount++;
      spawnHazards();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      player.update();
      handleHazards();
      handlePowerups();
    }

    function gameLoop() {
      update();
      draw();
      if (gameRunning) animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      score = 0;
      frameCount = 0;
      hazards = [];
      powerups = [];
      player.x = canvas.width / 2 - 15;
      player.hasShield = false;

      scoreDisplay.innerText = score;
      gameRunning = true;

      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');

      cancelAnimationFrame(animationId);
      gameLoop();
    }

    function endGame() {
      gameRunning = false;
      cancelAnimationFrame(animationId);
      overText.innerText = `Final Score: ${score}`;
      gameOverScreen.classList.remove('hidden');
    }

    // Input Controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') player.isMovingRight = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') player.isMovingLeft = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') player.isMovingRight = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') player.isMovingLeft = false;
    });

    function handlePointer(e) {
      if (!gameRunning) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const relativeX = clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        player.x = relativeX - player.size / 2;
      }
    }

    canvas.addEventListener('mousemove', handlePointer);
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handlePointer(e);
    }, { passive: false });
  </script>
</body>
</html>
